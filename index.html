<!DOCTYPE html>
<html lang="zh-CN">
<head>
   <meta name="apple-mobile-web-app-capable" content="yes">
   <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
   <meta name="apple-mobile-web-app-title" content="单词拼读">
   <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/abc.png"> <!-- 可替换为您喜欢的图标链接 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小学英语拼读默写 (音节高亮专业版)</title>
<style>
:root { --primary: #4A90E2; --secondary: #50E3C2; --bg: #F5F7FA; --card-bg: #FFFFFF; --text: #333; --text-light: #666; --accent: #E25041; --success: #2ECC71; --warning: #F39C12; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
.header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;}
h1 { font-size: 1.1rem; color: var(--primary); display: flex; align-items: center; gap: 5px; }
.header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;}
select { padding: 6px 10px; border-radius: 15px; border: 2px solid var(--primary); background: white; font-size: 0.9rem; color: var(--primary); font-weight: bold; outline: none; max-width: 160px; }
.btn-icon { background: white; border: 2px solid var(--primary); color: var(--primary); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; transition: all 0.2s; }
.btn-icon.active { background: var(--warning); border-color: var(--warning); color: white; }
.btn-icon.wrong-book.active { background: var(--accent); border-color: var(--accent); }
.card { background: var(--card-bg); width: 100%; max-width: 600px; border-radius: 20px; box-shadow: 0 8px 25px rgba(74, 144, 226, 0.12); padding: 25px 20px; text-align: center; margin-bottom: 20px; }
.word { font-size: 3rem; font-weight: 800; color: var(--primary); margin-bottom: 15px; letter-spacing: 2px; display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; min-height: 60px; align-items: center;}
.syllable-span { display: inline-block; padding: 4px 6px; border-radius: 8px; transition: all 0.2s ease; background: rgba(74, 144, 226, 0.05); }
.syllable-span.highlight { background-color: rgba(226, 80, 65, 0.15); color: var(--accent); transform: scale(1.1); }
.letter-span { transition: all 0.2s ease; display: inline-block; }
.letter-span.highlight { color: var(--accent); transform: scale(1.3) translateY(-5px); text-shadow: 0 4px 8px rgba(226, 80, 65, 0.3); }
.phonetic { font-size: 1.3rem; color: var(--text-light); margin-bottom: 15px; }
.meaning { font-size: 1.6rem; font-weight: bold; color: var(--accent); margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px dashed #eee; }
.details { text-align: left; font-size: 0.95rem; line-height: 1.6; }
.detail-item { margin-bottom: 10px; padding: 8px 12px; background: #F8F9FA; border-radius: 8px; border-left: 3px solid var(--secondary); }
.detail-label { font-weight: bold; color: var(--primary); margin-right: 5px; }
.example { font-style: italic; color: #555; background: #E8F4FD; padding: 10px; border-radius: 8px; margin-top: 10px; border-left: 3px solid var(--primary); }
.stats-bar { display: flex; justify-content: space-around; margin-top: 20px; padding-top: 15px; border-top: 2px dashed #eee; font-size: 0.95rem; color: var(--text-light); }
.stats-bar b { color: var(--text); font-size: 1.1rem; }
.dictation-area { display: none; margin-top: 15px; }
.dictation-area.show { display: block; }
.cloze-area { display: none; background: #FFF3E0; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 2px dashed var(--warning); }
.cloze-sentence { font-size: 1.4rem; font-weight: bold; color: #333; margin-bottom: 10px; line-height: 1.5; }
.cloze-hint { font-size: 1rem; color: var(--accent); font-style: italic; }
.dictation-input { width: 100%; padding: 15px; font-size: 1.8rem; font-weight: bold; text-align: center; border: 3px solid #ddd; border-radius: 12px; outline: none; color: var(--primary); letter-spacing: 2px; margin-bottom: 15px; }
.dictation-input.correct { border-color: var(--success); background: #E8F8F0; color: var(--success); }
.dictation-input.wrong { border-color: var(--accent); background: #FDEDEC; color: var(--accent); }
.dictation-controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px;}
.btn-dict { padding: 10px 16px; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
.btn-listen { background: #E8F4FD; color: var(--primary); }
.btn-hint { background: #FEF5E7; color: var(--warning); }
.btn-cloze { background: #E8F5E9; color: var(--success); }
.btn-cloze.active { background: var(--success); color: white; }
.btn-answer { background: #F2F3F4; color: var(--text-light); }
.btn-check { background: var(--success); color: white; flex-grow: 1; max-width: 150px; }
.btn-next { background: var(--primary); color: white; flex-grow: 1; max-width: 150px; display: none; }
.feedback-msg { margin-top: 15px; font-size: 1.2rem; font-weight: bold; min-height: 30px; }
.feedback-msg.success { color: var(--success); }
.feedback-msg.error { color: var(--accent); }
.controls { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.btn { flex: 1; padding: 15px; border: none; border-radius: 14px; font-size: 1.1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn-nav { background: white; color: var(--primary); border: 2px solid var(--primary); }
.btn-play { background: var(--primary); color: white; flex: 1.5; box-shadow: 0 5px 15px rgba(74, 144, 226, 0.3); }
.btn-play.playing { background: var(--accent); animation: pulse 1.5s infinite; }
.auto-play-container { margin-top: 15px; display: flex; align-items: center; gap: 10px; font-size: 0.95rem; color: var(--text-light); cursor: pointer; }
.auto-play-container.disabled { opacity: 0.5; pointer-events: none; }
.toggle { width: 46px; height: 26px; background: #ccc; border-radius: 13px; position: relative; transition: background 0.3s; }
.toggle.active { background: var(--secondary); }
.toggle::after { content: ''; position: absolute; width: 22px; height: 22px; background: white; border-radius: 50%; top: 2px; left: 2px; transition: transform 0.3s; }
.toggle.active::after { transform: translateX(20px); }
.progress { margin-top: 12px; font-size: 0.85rem; color: var(--text-light); }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
.modal-overlay.show { display: flex; }
.modal { background: white; border-radius: 20px; padding: 25px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
.modal h2 { font-size: 1.3rem; color: var(--primary); margin-bottom: 20px; text-align: center; }
.setting-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.setting-item input[type="number"] { width: 60px; padding: 6px; border: 2px solid #ddd; border-radius: 8px; text-align: center; font-weight: bold; color: var(--primary); }
.btn-save { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
.btn-reset { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 15px; }
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
@media (min-width: 768px) { .word { font-size: 4rem; } .meaning { font-size: 2rem; } .card { padding: 35px 30px; } }
</style>
</head>
<body>
<div class="header">
    <h1>🎒 音节拼读默写</h1>
    <div class="header-controls">
        <select id="unitSelect"></select>
        <button class="btn-icon wrong-book" id="wrongBookBtn" onclick="toggleWrongBook()" title="错题本">📚</button>
        <button class="btn-icon" id="dictationToggle" onclick="toggleDictationMode()" title="默写模式">✍️</button>
        <button class="btn-icon" onclick="openSettings()" title="设置">⚙️</button>
    </div>
</div>
<div class="card" id="card">
    <div id="learnView">
        <div class="word" id="wordDisplay"></div>
        <div class="phonetic" id="phoneticDisplay"></div>
        <div class="meaning" id="meaningDisplay"></div>
        <div class="details" id="detailsDisplay"></div>
    </div>
    <div id="dictationView" style="display: none;">
        <div class="cloze-area" id="clozeArea">
            <div class="cloze-sentence" id="clozeSentence"></div>
            <div class="cloze-hint" id="clozeHint"></div>
        </div>
        <div class="meaning" id="dictationMeaning" style="font-size: 2rem; margin-bottom: 10px;"></div>
        <div class="phonetic" id="dictationPhonetic" style="margin-bottom: 20px;"></div>
        <div class="dictation-area show">
            <input type="text" class="dictation-input" id="dictationInput" placeholder="输入英文单词" autocomplete="off" autocapitalize="off" spellcheck="false">
            <div class="dictation-controls">
                <button class="btn-dict btn-listen" onclick="playForDictation()">🔊 听音</button>
                <button class="btn-dict btn-hint" onclick="showHint()">💡 提示</button>
                <button class="btn-dict btn-cloze" id="clozeToggle" onclick="toggleClozeMode()">📖 填空</button>
                <button class="btn-dict btn-answer" onclick="showAnswer()">👁️ 答案</button>
            </div>
            <div class="feedback-msg" id="feedbackMsg"></div>
            <div class="dictation-controls" style="margin-top: 15px;">
                <button class="btn-dict btn-check" id="btnCheck" onclick="checkAnswer()">✅ 检查</button>
                <button class="btn-dict btn-next" id="btnNext" onclick="nextWord()">➡️ 下一个</button>
            </div>
        </div>
    </div>
    <div class="stats-bar">
        <span>✅ <b id="statCorrect">0</b></span>
        <span>❌ <b id="statWrong">0</b></span>
        <span>🎯 <b id="statRate">0%</b></span>
    </div>
</div>
<div class="controls">
    <button class="btn btn-nav" onclick="prevWord()">◀️</button>
    <button class="btn btn-play" id="playBtn" onclick="togglePlay()">🔊 播放拼读</button>
    <button class="btn btn-nav" onclick="nextWord()">▶️</button>
</div>
<div class="auto-play-container" id="autoPlayContainer" onclick="toggleAutoPlay()">
    <div class="toggle" id="autoPlayToggle"></div>
    <span>自动连播</span>
</div>
<div class="progress" id="progressDisplay">1 / 10</div>
<div class="modal-overlay" id="settingsModal">
    <div class="modal">
        <h2>⚙️ 设置</h2>
        <div class="setting-item"><span>🔤 单词读几遍</span><input type="number" id="setWordCount" min="0" max="5" value="2"></div>
        <div class="setting-item"><span>🔠 音节/字母拼几遍</span><input type="number" id="setLetterCount" min="0" max="5" value="2"></div>
        <div class="setting-item"><span>🔄 结尾巩固</span><input type="checkbox" id="setEndWord" checked></div>
        <div class="setting-item"><span>🇨🇳 读中文</span><input type="checkbox" id="setReadMeaning" checked></div>
        <button class="btn-save" onclick="saveSettings()">✅ 保存</button>
        <hr style="margin: 20px 0; border: 0; border-top: 1px dashed #eee;">
        <button class="btn-reset" onclick="resetProgress()">🗑️ 重置所有记录</button>
    </div>
</div>

<script>

const SYLLABLE_DICT = {

    'delicious':['de','li','cious'], 'favourite':['fa','vour','ite'], 'wonderful':['won','der','ful'], 'water bottle':['wa','ter','bot','tle'],

    'thousand':['thou','sand'], 'inspiring':['in','spir','ing'], 'pumpkin':['pump','kin'], 'restaurant':['res','tau','rant'],
    'airport':['air','port'], 'new zealand':['new','zea','land'], 'paris':['par','is'], 'eiffel':['ei','ffel'], 'terracotta':['ter','ra','cot','ta'],
    'warriors':['war','ri','ors'], 'marathon':['mar','a','thon'], 'yesterday':['yes','ter','day'], 'notice':['no','tice'], 'exciting':['ex','ci','ting'],
    'unhappy':['un','hap','py'], 'microscope':['mi','cro','scope'], 'difficult':['dif','fi','cult'], 'planet':['plan','et'], 'satellite':['sat','el','lite'],
    'telescope':['tel','e','scope'], 'astronaut':['as','tro','naut'], 'spaceship':['space','ship'], 'taikonaut':['tai','ko','naut'],
    'toothpaste':['tooth','paste'], 'question':['ques','tion'], 'sunset':['sun','set'], 'electricity':['e','lec','tric','i','ty'],
    'resource':['re','source'], 'conditioner':['con','di','tion','er'], 'difference':['dif','fer','ence'], 'reduce':['re','duce'], 'reuse':['re','use'],
    'beautiful':['beau','ti','ful'], 'elephant':['e','le','phant'], 'pineapple':['pine','ap','ple'], 'watermelon':['wa','ter','me','lon'],
    'strawberry':['stra','wber','ry'], 'tomorrow':['to','mor','row'], 'wednesday':['wed','nes','day'], 'thursday':['thur','sday'],
    'saturday':['sat','ur','day'], 'computer':['com','pu','ter'], 'telephone':['tel','e','phone'], 'television':['tel','e','vi','sion'],
    'supermarket':['su','per','mar','ket'], 'hospital':['hos','pi','tal'], 'library':['li','bra','ry'], 'dictionary':['dic','tion','ar','y'],
    'interesting':['in','ter','est','ing'], 'important':['im','por','tant'], 'different':['dif','fer','ent'], 'surprised':['sur','prised'],
    'dangerous':['dan','ger','ous'], 'birthday':['birth','day'], 'halloween':['hal','low','een'], 'valentine':['val','en','tine'],
    'umbrella':['um','brel','la'], 'sunglasses':['sun','glass','es'], 'expensive':['ex','pen','sive'], 'vegetable':['veg','e','ta','ble']
};

function getSyllables(word) {
    let cleanWord = word.toLowerCase().replace(/[^a-z\s]/g, '');
    if (SYLLABLE_DICT[cleanWord]) return SYLLABLE_DICT[cleanWord];
    if (cleanWord.includes(' ')) return cleanWord.split(' ').map(w => SYLLABLE_DICT[w] || [w]).flat();
    if (cleanWord.length <= 3) return cleanWord.split('');
    let matches = [...cleanWord.matchAll(/[aeiouy]+/gi)];
    if (matches.length <= 1) return cleanWord.split('');
    let parts = [], lastIndex = 0;
    for(let i=0; i<matches.length; i++) {
        let m = matches[i], start = m.index, end = start + m[0].length;
        if (i === 0) parts.push(word.substring(0, end)); 
        else {
            let cons = word.substring(lastIndex, start);
            if (cons.length >= 2) { parts[parts.length-1] += cons.substring(0, cons.length - 1); parts.push(cons.substring(cons.length - 1) + m[0]); }
            else if (cons.length === 1) parts.push(cons + m[0]);
            else parts.push(m[0]);
        }
        lastIndex = end;
    }
    if (lastIndex < word.length) parts[parts.length-1] += word.substring(lastIndex);
    return parts.filter(p => p.length > 0);
}

    let c = 0, w = 0; filteredList.forEach(item => { if (wordStats[item.word]) { c += wordStats[item.word].correct; w += wordStats[item.word].wrong; } });
    const t = c + w; document.getElementById('statCorrect').textContent = c; document.getElementById('statWrong').textContent = w;
    document.getElementById('statRate').textContent = (t > 0 ? Math.round((c / t) * 100) : 0) + '%';
}
function resetProgress() { if(confirm('确定清空？')) { localStorage.removeItem('wordPlayerProgress'); wordStats = {}; updateStatsUI(); alert('已重置！'); } }
function loadSettings() { const s = localStorage.getItem('wordPlayerSettings'); if (s) settings = JSON.parse(s); document.getElementById('setWordCount').value = settings.wordCount; document.getElementById('setLetterCount').value = settings.letterCount; document.getElementById('setEndWord').checked = settings.endWord; document.getElementById('setReadMeaning').checked = settings.readMeaning; }
function saveSettings() { settings.wordCount = parseInt(document.getElementById('setWordCount').value)||0; settings.letterCount = parseInt(document.getElementById('setLetterCount').value)||0; settings.endWord = document.getElementById('setEndWord').checked; settings.readMeaning = document.getElementById('setReadMeaning').checked; localStorage.setItem('wordPlayerSettings', JSON.stringify(settings)); closeSettings(); }
function openSettings() { document.getElementById('settingsModal').classList.add('show'); }
function closeSettings() { document.getElementById('settingsModal').classList.remove('show'); }
function filterWords() { filteredList = vocabulary.filter(item => item.unit === currentUnit); }

function toggleWrongBook() {
    isWrongBookMode = !isWrongBookMode; const btn = document.getElementById('wrongBookBtn');
    if (isWrongBookMode) {
        filteredList = vocabulary.filter(item => wordStats[item.word] && wordStats[item.word].wrong > 0);
        if (filteredList.length === 0) { alert('🎉 太棒了！目前没有错题！'); isWrongBookMode = false; filterWords(); }
        else { btn.classList.add('active'); currentIndex = 0; renderCard(); }
    } else exitWrongBook();
}
function exitWrongBook() { isWrongBookMode = false; document.getElementById('wrongBookBtn').classList.remove('active'); filterWords(); currentIndex = 0; renderCard(); }
function toggleClozeMode() { isClozeMode = !isClozeMode; document.getElementById('clozeToggle').classList.toggle('active', isClozeMode); renderCard(); }

function renderCard() {
    const item = filteredList[currentIndex]; if (!item) return;
    document.getElementById('progressDisplay').textContent = `${currentIndex + 1} / ${filteredList.length}`;
    clearHighlights(); window.speechSynthesis.cancel(); isPlaying = false; updatePlayButton(); updateStatsUI();
    const syllables = getSyllables(item.word);
    let wordHtml = syllables.map(syl => `<span class="syllable-span">${syl.split('').map(l => l === ' ' ? '&nbsp;' : `<span class="letter-span">${l}</span>`).join('')}</span>`).join('');
    document.getElementById('wordDisplay').innerHTML = wordHtml;

    if (isDictationMode) {
        document.getElementById('learnView').style.display = 'none'; document.getElementById('dictationView').style.display = 'block';
        document.getElementById('dictationPhonetic').textContent = item.phonetic;
        if (isClozeMode && item.example) {
            let regex = new RegExp(`\\b${item.word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i');
            let cloze = item.example.replace(regex, '_______'); if (cloze === item.example) cloze = item.example.replace(new RegExp(item.word, 'i'), '_______');
            document.getElementById('clozeSentence').textContent = cloze; document.getElementById('clozeHint').textContent = `(${item.meaning})`;
            document.getElementById('clozeArea').style.display = 'block'; document.getElementById('dictationMeaning').style.display = 'none';
        } else {
            document.getElementById('clozeArea').style.display = 'none'; document.getElementById('dictationMeaning').style.display = 'block';
            document.getElementById('dictationMeaning').textContent = item.meaning;
        }
        const input = document.getElementById('dictationInput'); input.value = ''; input.className = 'dictation-input'; input.disabled = false; input.focus();
        document.getElementById('feedbackMsg').textContent = ''; document.getElementById('btnCheck').style.display = 'flex'; document.getElementById('btnNext').style.display = 'none';
        if (isAutoPlay) toggleAutoPlay(); document.getElementById('autoPlayContainer').classList.add('disabled');
    } else {
        document.getElementById('learnView').style.display = 'block'; document.getElementById('dictationView').style.display = 'none';
        document.getElementById('phoneticDisplay').textContent = item.phonetic; document.getElementById('meaningDisplay').textContent = item.meaning;
                let detailsHtml = '';
                if (item.partOfSpeech) detailsHtml += `<div class="detail-item"><span class="detail-label">🏷️ 词性:</span> ${item.partOfSpeech}</div>`;
                if (item.usage) detailsHtml += `<div class="detail-item"><span class="detail-label">💡 用法:</span> ${item.usage}</div>`;
                if (item.conversion) detailsHtml += `<div class="detail-item"><span class="detail-label">🔄 转换:</span> ${item.conversion}</div>`;
                if (item.pattern) detailsHtml += `<div class="detail-item"><span class="detail-label">📝 句型:</span> ${item.pattern}</div>`;
                if (item.example) detailsHtml += `<div class="example"><span class="detail-label">📖 例句:</span> ${item.example}</div>`;
                document.getElementById('detailsDisplay').innerHTML = detailsHtml || '<div class="detail-item">暂无详细信息</div>';
                
                document.getElementById('autoPlayContainer').classList.remove('disabled');
    }
}
function clearHighlights() { document.querySelectorAll('.syllable-span, .letter-span').forEach(el => el.classList.remove('highlight')); }
function toggleDictationMode() { isDictationMode = !isDictationMode; document.getElementById('dictationToggle').classList.toggle('active', isDictationMode); renderCard(); }

function buildPlayQueue(word, isDictation = false) {
    const syllables = getSyllables(word); const isLongWord = word.length > 4 && syllables.length > 1; const queue = [];
    for (let i = 0; i < settings.wordCount; i++) queue.push({ text: word, type: 'word' });
    for (let i = 0; i < settings.letterCount; i++) {
        if (isLongWord) syllables.forEach(syl => queue.push({ text: syl, type: 'syllable' }));
        else word.replace(/[^a-zA-Z]/g, '').split('').forEach(char => queue.push({ text: char, type: 'letter' }));
    }
    if (settings.endWord) queue.push({ text: word, type: 'word' });
    if (!isDictation && settings.readMeaning) { const item = filteredList[currentIndex]; for (let i = 0; i < settings.meaningCount; i++) queue.push({ text: item.meaning, type: 'chinese' }); }
    return queue;
}
function syncHighlight(item) {
    clearHighlights(); const syllableSpans = document.querySelectorAll('.syllable-span');
    if (item.type === 'word') syllableSpans.forEach(span => span.classList.add('highlight'));
    else if (item.type === 'syllable') {
        const idx = Array.from(syllableSpans).findIndex(s => s.textContent.toLowerCase() === item.text.toLowerCase());
        if (idx !== -1) syllableSpans[idx].classList.add('highlight');
    } else if (item.type === 'letter') {
        syllableSpans.forEach(span => { span.querySelectorAll('.letter-span').forEach(l => { if (l.textContent.toLowerCase() === item.text.toLowerCase()) { span.classList.add('highlight'); l.classList.add('highlight'); } }); });
    }
}
function playAudioQueue(queue) {
    let idx = 0; function speakNext() {
        if (!isPlaying || idx >= queue.length) { isPlaying = false; updatePlayButton(); clearHighlights(); if (isAutoPlay && !isDictationMode) setTimeout(nextWord, 1500); return; }
        const currentItem = queue[idx]; const utterance = new SpeechSynthesisUtterance(currentItem.text);
        utterance.lang = currentItem.type === 'chinese' ? 'zh-CN' : 'en-US'; utterance.rate = currentItem.type === 'letter' || currentItem.type === 'syllable' ? 0.8 : 0.75;
        syncHighlight(currentItem); utterance.onend = () => { idx++; setTimeout(speakNext, 300); }; window.speechSynthesis.speak(utterance);
    } speakNext();
}
function playForDictation() { window.speechSynthesis.cancel(); clearHighlights(); const item = filteredList[currentIndex]; const queue = buildPlayQueue(item.word, true); isPlaying = true; updatePlayButton(); playAudioQueue(queue); }
function showHint() {
    const item = filteredList[currentIndex]; const syllables = getSyllables(item.word);
    let hint = syllables.length > 1 && item.word.length > 4 ? syllables.map((s, i) => i === 0 ? s : ' _').join(' ') : item.word.split('').map((l, i) => i === 0 ? l : ' _').join('');
    document.getElementById('feedbackMsg').textContent = `💡 ${hint}`;
}
function showAnswer() { const item = filteredList[currentIndex]; document.getElementById('dictationInput').value = item.word; document.getElementById('dictationInput').className = 'dictation-input wrong'; document.getElementById('feedbackMsg').textContent = `👁️ ${item.word}`; document.getElementById('btnCheck').style.display = 'none'; document.getElementById('btnNext').style.display = 'flex'; }
function checkAnswer() {
    const item = filteredList[currentIndex]; const input = document.getElementById('dictationInput'); const ans = input.value.trim().toLowerCase(); if (!ans) return;
    if (!wordStats[item.word]) wordStats[item.word] = { correct: 0, wrong: 0 };
    if (ans === item.word.trim().toLowerCase()) {
        wordStats[item.word].correct++; input.className = 'dictation-input correct'; document.getElementById('feedbackMsg').textContent = '🎉 正确！'; document.getElementById('feedbackMsg').className = 'feedback-msg success';
        document.getElementById('btnCheck').style.display = 'none'; document.getElementById('btnNext').style.display = 'flex'; window.speechSynthesis.speak(new SpeechSynthesisUtterance("Great!"));
    } else {
        wordStats[item.word].wrong++; input.className = 'dictation-input wrong'; document.getElementById('feedbackMsg').textContent = '❌ 再试一次'; document.getElementById('feedbackMsg').className = 'feedback-msg error'; input.value = ''; input.focus();
    } saveProgress(); updateStatsUI();
}
function nextWord() { if (currentIndex < filteredList.length - 1) currentIndex++; else if (isAutoPlay && !isDictationMode) currentIndex = 0; else return; saveProgress(); renderCard(); if (isAutoPlay && !isDictationMode) setTimeout(() => togglePlay(), 800); }
function prevWord() { if (currentIndex > 0) { currentIndex--; saveProgress(); renderCard(); } }
function toggleAutoPlay() { if (!isDictationMode) { isAutoPlay = !isAutoPlay; document.getElementById('autoPlayToggle').classList.toggle('active', isAutoPlay); } }
function updatePlayButton() { const b = document.getElementById('playBtn'); b.innerHTML = isPlaying ? '⏸️' : '🔊'; b.classList.toggle('playing', isPlaying); }
function togglePlay() { if (isPlaying) { window.speechSynthesis.cancel(); clearHighlights(); isPlaying = false; updatePlayButton(); return; } isPlaying = true; updatePlayButton(); clearHighlights(); const item = filteredList[currentIndex]; const queue = buildPlayQueue(item.word, false); playAudioQueue(queue); }

document.addEventListener('keydown', (e) => { if (e.code === 'Space' && !isDictationMode) { e.preventDefault(); togglePlay(); } else if (e.code === 'ArrowRight') nextWord(); else if (e.code === 'ArrowLeft') prevWord(); else if (e.code === 'Escape') closeSettings(); });
document.getElementById('settingsModal').addEventListener('click', (e) => { if (e.target.id === 'settingsModal') closeSettings(); });
init();
</script>
